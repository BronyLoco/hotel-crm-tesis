events {
    worker_connections 1024;
}

http {
    server {
        listen 80;

        # --- SECCIÓN BORRADA/COMENTADA ---
        # El CORS ya lo maneja Node.js, así que quitamos esto de Nginx para evitar duplicados
        # add_header 'Access-Control-Allow-Origin' '*' always;
        # add_header 'Access-Control-Allow-Methods' ...
        # add_header 'Access-Control-Allow-Headers' ...
        # ---------------------------------

        # 1. SERVICIO DE HUÉSPEDES
        location /api/guests {
            proxy_pass http://host.docker.internal:3001;
            proxy_set_header Host $host;
        }

        # 2. SERVICIO DE HABITACIONES
        location /api/rooms {
            proxy_pass http://host.docker.internal:3002;
            proxy_set_header Host $host;
        }

        # 3. SERVICIO DE RESERVAS
        location /api/reservations {
            proxy_pass http://host.docker.internal:3003;
            proxy_set_header Host $host;
        }

        # 4. SERVICIO DE FACTURACIÓN
        location /api/billing {
            proxy_pass http://host.docker.internal:3004;
            proxy_set_header Host $host;
        }
        
        # 5. SERVICIO DE AUTENTICACIÓN
        location /api/auth {
            proxy_pass http://host.docker.internal:3005;
            proxy_set_header Host $host;
        }
    }
}